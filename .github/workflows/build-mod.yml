name: Build Fast Build Storage

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build clean ZIP
        run: ./build_mod_zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-build-storage
          path: dist/fast_build_storage_v*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --prerelease
            gh release view latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset latest "$asset" --yes
            done
          else
            gh release create latest --title "Latest build" --prerelease --notes "Automatically updated from the latest commit on master."
          fi

          gh release upload latest dist/fast_build_storage_v*.zip --clobber
